<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Child Voice Call</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; }
        video { width: 100%; max-width: 400px; background: #000; border-radius: 10px; }
        .controls { background: #222; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .timer { font-size: 24px; color: #0f0; margin: 10px 0; }
        .status { color: #ffaa00; }
    </style>
</head>
<body>
    <h1>🎤 অ্যাডমিন প্যানেল</h1>
    <button id="createRoomBtn">📞 কল শুরু করুন</button>
    <div id="roomInfo" style="display:none;">
        <p>লিংক: <input type="text" id="shareLink" readonly style="width:300px;"> <button id="copyBtn">কপি</button></p>
    </div>

    <div class="controls">
        <h3>🎙️ ভয়েস ইফেক্ট</h3>
        <select id="voiceEffect">
            <option value="normal">Normal</option>
            <option value="childVoice" selected>Child Voice</option>
            <option value="robot">Robot</option>
        </select>
        <button id="applyBtn">Apply</button>
    </div>

    <video id="remoteVideo" autoplay playsinline></video>
    <div class="timer" id="timer">00:00</div>
    <div class="status" id="callStatus">অপেক্ষারত...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let peerConnection, localStream, processedStream, roomId;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Audio Effect Logic
        async function setupVoice(effect) {
            const ctx = new AudioContext();
            const source = ctx.createMediaStreamSource(localStream);
            const destination = ctx.createMediaStreamDestination();
            
            if (effect === 'childVoice') {
                const processor = ctx.createScriptProcessor(4096, 1, 1);
                processor.onaudioprocess = (e) => {
                    const inData = e.inputBuffer.getChannelData(0);
                    const outData = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < inData.length; i++) {
                        let pos = Math.floor(i * 1.6) % inData.length;
                        outData[i] = inData[pos];
                    }
                };
                source.connect(processor);
                processor.connect(destination);
            } else { source.connect(destination); }
            
            processedStream = destination.stream;
        }

        document.getElementById('createRoomBtn').onclick = async () => {
            roomId = 'room_' + Math.random().toString(36).substr(2, 8);
            socket.emit('create-room', roomId, async (res) => {
                if (res.success) {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    await setupVoice('childVoice');
                    document.getElementById('shareLink').value = `${window.location.origin}/join.html?room=${roomId}`;
                    document.getElementById('roomInfo').style.display = 'block';
                    document.getElementById('callStatus').innerText = 'মেম্বারের জন্য অপেক্ষা করা হচ্ছে...';
                }
            });
        };

        socket.on('member-joined', async () => {
            peerConnection = new RTCPeerConnection(config);
            processedStream.getTracks().forEach(t => peerConnection.addTrack(t, processedStream));
            peerConnection.onicecandidate = (e) => e.candidate && socket.emit('ice-candidate', { roomId, candidate: e.candidate });
            peerConnection.ontrack = (e) => document.getElementById('remoteVideo').srcObject = e.streams[0];
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', { roomId, offer });
            document.getElementById('callStatus').innerText = 'সংযুক্ত';
        });

        socket.on('answer', (ans) => peerConnection.setRemoteDescription(new RTCSessionDescription(ans)));
        socket.on('ice-candidate', (can) => peerConnection.addIceCandidate(new RTCIceCandidate(can)));
    </script>
</body>
</html>
