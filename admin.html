<!DOCTYPE html>
<html>
<body>
    <video id="remoteVideo" autoplay playsinline style="width:100%"></video>
    <button id="callBtn">Start Call</button>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let pc;
        let roomId;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        document.getElementById('callBtn').onclick = async () => {
            roomId = 'test_' + Math.random();
            socket.emit('create-room', roomId, async (res) => {
                if (res.success) {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                    pc = new RTCPeerConnection(config);
                    stream.getTracks().forEach(t => pc.addTrack(t, stream));
                    pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
                    pc.onicecandidate = e => e.candidate && socket.emit('ice-candidate', { roomId, candidate: e.candidate });
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('offer', { roomId, offer });
                    alert('Share link: ' + location.origin + '/join.html?room=' + roomId);
                }
            });
        };

        socket.on('answer', async (answer) => { await pc.setRemoteDescription(new RTCSessionDescription(answer)); });
        socket.on('ice-candidate', async (c) => { await pc.addIceCandidate(new RTCIceCandidate(c)); });
    </script>
</body>
</html>
