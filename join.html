<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Call - Sabbir</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.8rem; margin-bottom: 20px; }
        .btn-receive {
            background-color: #28a745;
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn-receive:hover { background-color: #218838; transform: scale(1.05); }
        .btn-receive:disabled { background-color: #6c757d; cursor: not-allowed; }
        .status { margin-top: 20px; font-size: 16px; color: #ffcc00; }
        #remoteVideo { width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📞 Sabbir তোমাকে কল দিচ্ছে</h1>
        <button class="btn-receive" id="receiveBtn">✅ কল রিসিভ করুন</button>
        <div class="status" id="callStatus">কল রিসিভ করার জন্য বাটনে ক্লিক করুন</div>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let peerConnection;
        let localStream;
        let roomId = null;

        const receiveBtn = document.getElementById('receiveBtn');
        const callStatusDiv = document.getElementById('callStatus');
        const remoteVideo = document.getElementById('remoteVideo');

        // URL থেকে Room ID সংগ্রহ করা
        const urlParams = new URLSearchParams(window.location.search);
        roomId = urlParams.get('room');

        if (!roomId) {
            callStatusDiv.innerText = 'ভুল লিঙ্ক! সঠিক লিঙ্কে ক্লিক করুন।';
            receiveBtn.disabled = true;
        }

        const configuration = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // WebRTC Peer Connection তৈরি করা
        async function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            // নিজের অডিও/ভিডিও অ্যাড করা
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            // অ্যাডমিনের অডিও/ভিডিও রিসিভ করা
            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    remoteVideo.style.display = 'block';
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { roomId, candidate: event.candidate });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    callStatusDiv.innerText = 'কল সংযুক্ত - কথা বলুন';
                } else if (peerConnection.connectionState === 'disconnected') {
                    callStatusDiv.innerText = 'সংযোগ বিচ্ছিন্ন হয়েছে';
                }
            };
        }

        // কল রিসিভ বাটন ক্লিক করলে
        receiveBtn.onclick = async () => {
            receiveBtn.disabled = true;
            receiveBtn.innerText = 'কানেক্ট হচ্ছে...';

            try {
                // ক্যামেরা এবং মাইক পারমিশন (অ্যাডমিন শুধু অডিও চাইলে এখানে ভিডিও false করতে পারেন)
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                callStatusDiv.innerText = 'অনুমতি পাওয়া গেছে, রুমে জয়েন করছি...';

                socket.emit('join-room', roomId, (response) => {
                    if (response.success) {
                        callStatusDiv.innerText = 'অ্যাডমিনের সিগন্যালের জন্য অপেক্ষা করছি...';
                    } else {
                        callStatusDiv.innerText = 'এরর: ' + response.message;
                        receiveBtn.disabled = false;
                    }
                });
            } catch (err) {
                console.error(err);
                callStatusDiv.innerText = 'মাইক বা ক্যামেরা পারমিশন প্রয়োজন!';
                receiveBtn.disabled = false;
            }
        };

        // অ্যাডমিন থেকে অফার আসলে সেটি হ্যান্ডেল করা
        socket.on('offer', async (offer) => {
            if (!peerConnection) await createPeerConnection();
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            socket.emit('answer', { roomId, answer });
            callStatusDiv.innerText = 'কানেক্টিং...';
        });

        // ICE Candidate আদান-প্রদান
        socket.on('ice-candidate', async (candidate) => {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('Error adding candidate', e);
                }
            }
        });

        // অ্যাডমিন কল কেটে দিলে
        socket.on('admin-left', () => {
            callStatusDiv.innerText = 'অ্যাডমিন কল শেষ করেছেন';
            if (peerConnection) peerConnection.close();
            receiveBtn.disabled = true;
            remoteVideo.style.display = 'none';
        });
    </script>
</body>
</html>
