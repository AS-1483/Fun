<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Incoming Call</title>
    <style>
        body { background: #1e3c72; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .card { background: rgba(0,0,0,0.5); padding: 30px; border-radius: 15px; }
        button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📞 Sabbir তোমাকে কল দিচ্ছে</h1>
        <button id="joinBtn">✅ কল রিসিভ করুন</button>
        <p id="status">বাটনে ক্লিক করুন</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let peerConnection, localStream;
        const roomId = new URLSearchParams(window.location.search).get('room');

        document.getElementById('joinBtn').onclick = async () => {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            socket.emit('join-room', roomId, (res) => {
                if (res.success) document.getElementById('status').innerText = 'কানেক্ট হচ্ছে...';
                else alert(res.message);
            });
        };

        socket.on('offer', async (offer) => {
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.onicecandidate = (e) => e.candidate && socket.emit('ice-candidate', { roomId, candidate: e.candidate });
            peerConnection.ontrack = (e) => {
                const audio = new Audio();
                audio.srcObject = e.streams[0];
                audio.play();
            };
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { roomId, answer });
        });

        socket.on('ice-candidate', (can) => peerConnection.addIceCandidate(new RTCIceCandidate(can)));
    </script>
</body>
</html>
