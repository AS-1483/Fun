<!DOCTYPE html>
<html>
<body>
    <button id="answerBtn">Receive Call</button>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const socket = io();
        let pc;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        document.getElementById('answerBtn').onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            pc = new RTCPeerConnection(config);
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            pc.onicecandidate = e => e.candidate && socket.emit('ice-candidate', { roomId, candidate: e.candidate });
            socket.emit('join-room', roomId, (res) => { if (!res.success) alert('Join failed'); });
        };

        socket.on('offer', async (offer) => {
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('answer', { roomId, answer });
        });
        socket.on('ice-candidate', async (c) => { await pc.addIceCandidate(new RTCIceCandidate(c)); });
    </script>
</body>
</html>
